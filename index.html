<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Mpundu Maloba — Software Developer, Designer & Entrepreneur</title>
    <meta
      name="description"
      content="Mpundu Maloba is a software developer, graphic designer and entrepreneur building purposeful technology and creative solutions."
    />
    <meta name="author" content="Mpundu Maloba" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mpundumaloba.com/" />
    <meta
      property="og:title"
      content="Mpundu Maloba — Software Developer, Designer & Entrepreneur"
    />
    <meta
      property="og:description"
      content="Mpundu Maloba is a software developer, graphic designer and entrepreneur building purposeful technology and creative solutions."
    />

    <!-- Inter typeface from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&display=swap"
      rel="stylesheet"
    />

    <!--
      Theme flash prevention.
      This inline script runs synchronously before the first paint.
      It reads the stored theme preference and sets the data-theme attribute
      on <html> before React mounts, so there is no flash of the wrong theme.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'dark' || stored === 'light'
            ? stored
            : prefersDark
            ? 'dark'
            : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
